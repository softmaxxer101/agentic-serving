[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "labkit"
version = "1.0.0"
description = "Agentic Serving Lab Kit for vLLM 0.32.0 on an RTX 2050 4GB (Qwen3-0.6B)"
requires-python = ">=3.10"
dependencies = ["openai", "httpx", "numpy", "pandas", "matplotlib", "psutil", "huggingface_hub", "transformers", "fastapi", "uvicorn"]

[project.scripts]
lab = "labkit.cli:main"

[tool.setuptools]
packages = ["labkit"]
